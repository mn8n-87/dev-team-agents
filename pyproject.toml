[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-span"
version = "0.2.0"
description = "A team of AI agents for software development, powered by conductor-agent-sdk"
requires-python = ">=3.10"
dependencies = [
    "conductor-agent-sdk",
    "python-dotenv",
]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio", "ruff"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
asyncio_mode = "auto"
